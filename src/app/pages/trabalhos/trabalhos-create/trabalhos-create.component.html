<div class="page">
  <header class="header">
    <div>
      <h1>@if (modoEdicao) { Editar trabalho } @else { Cadastrar trabalho }</h1>
    </div>

    <div class="actions">
      <button type="button" class="secondary" [routerLink]="linkVoltar">Voltar</button>
      <button
        type="button"
        class="primary"
        (click)="salvar()"
        [disabled]="loading || loadingDisciplinas || disciplinas.length === 0"
      >
        @if (loading) { Salvando... } @else { Salvar }
      </button>
    </div>
  </header>

  @if (errorMessage) {
    <div class="alert error">{{ errorMessage }}</div>
  }

  <section class="card">
    @if (loadingDisciplinas) {
      <p class="muted">Carregando disciplinas...</p>
    } @else {
      <form (ngSubmit)="salvar()">
        <div class="grid">
          <label class="full">
            <span>Título</span>
            <input [(ngModel)]="form.titulo" name="titulo" />
          </label>

          <label class="full">
            <span>Descrição</span>
            <textarea [(ngModel)]="form.descricao" name="descricao" rows="3"></textarea>
          </label>

          <label class="full">
            <span>Link do arquivo do trabalho</span>
            <input
              [(ngModel)]="form.linkArquivoTrabalho"
              name="linkArquivoTrabalho"
              type="url"
              placeholder="https://..."
            />
          </label>

          <label>
            <span>Disciplina</span>
            <select
              [(ngModel)]="form.disciplinaId"
              name="disciplinaId"
              [disabled]="disciplinaBloqueada"
            >
              <option [ngValue]="null" disabled>Selecione uma disciplina</option>
              @for (disciplina of disciplinas; track disciplina.id) {
                <option [ngValue]="disciplina.id">{{ disciplina.nome }}</option>
              }
            </select>
          </label>

          <label>
            <span>Data início</span>
            <input [(ngModel)]="form.dataInicio" name="dataInicio" type="date" />
          </label>

          <label>
            <span>Data fim</span>
            <input [(ngModel)]="form.dataFim" name="dataFim" type="date" />
          </label>
        </div>

        <div class="footer">
          <button
            type="submit"
            class="primary"
            [disabled]="loading || disciplinas.length === 0"
          >
            @if (loading) { Salvando... } @else { Salvar }
          </button>
        </div>
      </form>
    }
  </section>
</div>
