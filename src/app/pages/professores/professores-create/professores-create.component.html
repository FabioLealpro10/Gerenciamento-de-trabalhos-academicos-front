<div class="page">
  <header class="header">
    <div>
      <h1>@if (modoEdicao) { Editar professor } @else { Cadastrar professor }</h1>
    </div>

    <div class="actions">
      <button type="button" class="secondary" routerLink="/professores">Voltar</button>
    </div>
  </header>

  @if (successMessage) {
    <div class="alert success">{{ successMessage }}</div>
  }

  @if (errorMessage) {
    <div class="alert error">{{ errorMessage }}</div>
  }

  <section class="card">
    <form (ngSubmit)="salvar()">
      <div class="grid">
        <label>
          <span>Nome</span>
          <input [(ngModel)]="form.nome" name="nome" autocomplete="name" />
        </label>

        <label>
          <span>Email</span>
          <input
            [(ngModel)]="form.email"
            name="email"
            type="email"
            autocomplete="email"
          />
        </label>

        <label>
          <span>Senha</span>
          <app-campo-senha
            name="password"
            [(valor)]="form.password"
            autocomplete="new-password"
            [placeholder]="modoEdicao ? 'Deixe em branco para não alterar' : ''"
          />
        </label>

        <label>
          <span>Área de atuação</span>
          <input [(ngModel)]="form.areaAtuacao" name="areaAtuacao" />
        </label>
      </div>

      <div class="footer">
        <button type="submit" class="primary" [disabled]="loading">
          @if (loading) { Salvando... } @else { Salvar }
        </button>
      </div>
    </form>
  </section>
</div>
