<div class="page">
  <header class="header">
    <div>
      <h1>Alterar credenciais</h1>
      @if (adminNome) {
        <p class="subtitle">{{ adminNome }}</p>
      }
    </div>

    <div class="actions">
      <button type="button" class="secondary" routerLink="/admins">Voltar</button>
      <button type="button" class="primary" (click)="salvar()" [disabled]="loading">
        @if (loading) { Salvando... } @else { Salvar }
      </button>
    </div>
  </header>

  @if (errorMessage) {
    <div class="alert error">{{ errorMessage }}</div>
  }

  <section class="card">
    <form (ngSubmit)="salvar()">
      <div class="grid">
        <label>
          <span>E-mail</span>
          <input
            [(ngModel)]="form.email"
            name="email"
            type="email"
            autocomplete="email"
          />
        </label>

        <label>
          <span>Nova senha</span>
          <input
            [(ngModel)]="form.password"
            name="password"
            type="password"
            autocomplete="new-password"
            placeholder="Deixe em branco para não alterar"
          />
        </label>
      </div>

      <div class="footer">
        <button type="submit" class="primary" [disabled]="loading">
          @if (loading) { Salvando... } @else { Salvar alterações }
        </button>
      </div>
    </form>
  </section>
</div>
